# Spark is catalog-first and asks Polaris for delegated storage credentials.
# The MinIO endpoint is still configured for Iceberg's S3FileIO, but Spark does
# not rely on raw S3 filesystem paths or static AWS env vars.
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                      polaris

spark.sql.catalog.polaris                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.polaris.type                rest
spark.sql.catalog.polaris.uri                 http://polaris:8181/api/catalog
spark.sql.catalog.polaris.warehouse           polaris_bootstrap_catalog
spark.sql.catalog.polaris.credential          root:s3cr3t
spark.sql.catalog.polaris.scope               PRINCIPAL_ROLE:ALL
spark.sql.catalog.polaris.io-impl             org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.polaris.s3.endpoint         http://minio:9000
spark.sql.catalog.polaris.s3.path-style-access true
spark.sql.catalog.polaris.header.X-Iceberg-Access-Delegation vended-credentials
spark.sql.catalog.polaris.token-refresh-enabled true
